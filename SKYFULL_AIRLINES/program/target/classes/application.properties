spring.datasource.url=jdbc:sqlserver://localhost;databaseName=SkyfullDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=airline_user
spring.datasource.password=Password123!
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
# Use update so it keeps your schema, but be careful as Hibernate might try to "fix" case sensitivity by creating new columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Physical naming strategy to force Hibernate to use EXACT names from @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Serve static content from standard locations
spring.web.resources.static-locations=classpath:/static/

server.port=8080
